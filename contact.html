<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Creative director Khan</title>
<meta name="description" content="Tell me what you're working on and where you want it to go.">
<meta name="theme-color" content="#0c0c0d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<a class="skip" href="#main">Skip to content</a>

<header class="header" id="top">
  <div class="wrap header-in">
    <a class="wordmark" href="./">Creative director <b>Khan</b></a>
    <p class="tagline">Short-form video</p>
  </div>
</header>

<nav class="nav" aria-label="Primary">
  <div class="wrap nav-in">
    <ul>
      <li><a href="./">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html" aria-current="page">Contact</a></li>
    </ul>
  </div>
</nav>

<main class="bare" id="main">
  <div class="wrap">
    <h1>Let's talk</h1>

    <form class="lead" id="leadform" novalidate>
      <div>
        <label for="f-name">Name</label>
        <input id="f-name" name="name" type="text" autocomplete="name" required>
      </div>
      <div>
        <label for="f-email">Email</label>
        <input id="f-email" name="email" type="email" autocomplete="email" required>
      </div>
      <div>
        <label for="f-link">Link to your work</label>
        <input id="f-link" name="link" type="url" placeholder="https://">
      </div>
      <div>
        <label for="f-msg">What are you making?</label>
        <textarea id="f-msg" name="message" required></textarea>
      </div>
      <button class="btn" type="submit">Send</button>
      <p class="cta-note" id="formnote" role="status"></p>
    </form>
  </div>
</main>

<footer class="footer">
  <div class="wrap footer-in">
    <ul class="policies">
      <li><a href="policies.html#social">House rules</a></li>
      <li><a href="policies.html#ai">How I use AI</a></li>
    </ul>
    <p class="colophon"><span class="tc">&copy; 2026</span> Emaan Khan</p>
  </div>
</footer>

<script>
(function(){
  // No backend on a static site: the form composes the message and hands it to the
  // sender's own mail client, so no address is printed on the page.
  // SWAP: point f.action at a Formspree / Netlify Forms endpoint for a real
  // database capture (Assignment 2 goal: "create lead form and database").
  var f=document.getElementById('leadform'), note=document.getElementById('formnote');
  f.addEventListener('submit',function(ev){
    ev.preventDefault();
    if(!f.checkValidity()){ note.textContent='Name, email and a message, please.'; f.reportValidity(); return; }
    var v=function(id){return (document.getElementById(id).value||'').trim()};
    var body='Name: '+v('f-name')+'\nEmail: '+v('f-email')+'\nWork: '+(v('f-link')||'-')+'\n\n'+v('f-msg');
    note.textContent='Opening your email app...';
    window.location.href='mailto:emaan@venture-x.ca'
      +'?subject='+encodeURIComponent('New enquiry - '+v('f-name'))
      +'&body='+encodeURIComponent(body);
  });
})();
</script>
</body>
</html>
